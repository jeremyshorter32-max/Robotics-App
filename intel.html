<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robotics Market Pulse</title>
<meta name="description" content="Weekly robotics market intelligence for Aldar executive management: trends, products and investments worldwide.">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aldar Robotics">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12102A">
<link rel="stylesheet" href="assets/css/intel-nav.css?v=20261031a">
<style>
@font-face{font-family:'Poppins';font-style:normal;font-weight:300;font-display:swap;src:url("assets/fonts/poppins-300-latin.woff2") format('woff2')}
@font-face{font-family:'Poppins';font-style:normal;font-weight:400;font-display:swap;src:url("assets/fonts/poppins-400-latin.woff2") format('woff2')}
@font-face{font-family:'Poppins';font-style:normal;font-weight:500;font-display:swap;src:url("assets/fonts/poppins-500-latin.woff2") format('woff2')}
@font-face{font-family:'Poppins';font-style:normal;font-weight:600;font-display:swap;src:url("assets/fonts/poppins-600-latin.woff2") format('woff2')}

/* Aldar palette, as on the fleet map */
:root{
  --navy:#12102A; --navy-2:#100E28;
  --accent:#769CD2; --accent-soft:#9DB9E0; --accent-ink:#3F6FAE; --mist:#EAF0F9;
  --ink:#14122B; --ink-2:#3B3B4A; --muted:#6A6A78;
  --paper:#F4F5F8; --card:#FFFFFF; --line:rgba(18,16,42,0.08); --line-2:rgba(18,16,42,0.14);
  --shadow:0 1px 2px rgba(18,16,42,0.05),0 1px 1px rgba(18,16,42,0.03);
  --shadow-hover:0 12px 28px rgba(18,16,42,0.09),0 2px 6px rgba(18,16,42,0.05);
  --inv:#1F7A4D; --prod:#3F6FAE; --dep:#94681A; --trend:#5B4A9E;
  --header-h:57px;
}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-padding-top:150px}
body{background:var(--paper);color:var(--ink);font-family:Poppins,system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,select{font-family:inherit;font-size:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Header (same as the fleet map) ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;padding:12px 24px;background:var(--navy);border-bottom:1px solid rgba(118,156,210,0.22)}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;min-width:0}
.brand img{height:24px;width:auto;display:block}
.brand .sep{width:1px;height:22px;background:rgba(255,255,255,0.25)}
.brand .t1{display:block;font-size:15px;font-weight:500;color:#fff;letter-spacing:-0.01em;line-height:1.2;white-space:nowrap}
.brand .t2{display:block;font-size:9px;font-weight:500;letter-spacing:0.26em;text-transform:uppercase;color:var(--accent-soft)}
.top .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid rgba(255,255,255,0.28);background:transparent;color:#fff;font-size:10px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent-soft)}
.btn.primary{border-color:var(--accent);background:rgba(118,156,210,0.12)}
.btn.primary:hover{background:var(--accent);color:var(--navy)}
.sel{position:relative;display:block}
.sel select{appearance:none;-webkit-appearance:none;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.18);color:#fff;font-size:12px;font-weight:500;padding:8px 32px 8px 12px;cursor:pointer;max-width:56vw;text-overflow:ellipsis}
.sel select option{color:#12102A}
.sel svg{position:absolute;right:11px;top:50%;transform:translateY(-50%);pointer-events:none}

/* ---------- Edition hero ---------- */
.hero{background:linear-gradient(180deg,var(--navy-2) 0%,#15133A 100%);color:#fff;border-bottom:1px solid rgba(118,156,210,0.16)}
.hero-in{max-width:1200px;margin:0 auto;padding:40px 24px 34px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px 56px;align-items:end}
.eyebrow{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:500;color:var(--accent-soft)}
.eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:blink 2.4s infinite}
.hero h1{margin:12px 0 10px;font-size:34px;font-weight:300;line-height:1.18;letter-spacing:-0.02em;max-width:780px;text-wrap:balance}
.hero .period{margin:0;font-size:13px;color:rgba(255,255,255,0.62)}
.stats{display:flex;align-items:stretch}
.stat{display:flex;flex-direction:column;justify-content:flex-end;gap:4px;padding:2px 26px;border-left:1px solid rgba(157,185,224,0.24);background:transparent;color:#fff;text-align:left;font:inherit}
.stat:first-child{padding-left:0;border-left:0}
.stat b{font-size:34px;font-weight:300;line-height:1;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{font-size:12px;color:var(--accent-soft);white-space:nowrap}
button.stat{cursor:pointer;border-top:0;border-right:0;border-bottom:0}
button.stat span{display:inline-flex;align-items:center;gap:6px}
button.stat span::after{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);opacity:.7}
button.stat:hover span,button.stat[aria-pressed="true"] span{color:#fff}
button.stat[aria-pressed="true"] b{color:var(--accent-soft)}

/* ---------- Layout ---------- */
.wrap{max-width:1200px;margin:0 auto;padding:28px 24px 8px;display:grid;grid-template-columns:330px minmax(0,1fr);gap:28px;align-items:start}
.wrap > *{min-width:0}
.side{position:sticky;top:calc(var(--header-h) + 20px);display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - var(--header-h) - 40px);overflow:auto;scrollbar-width:thin}
.card{background:var(--card);box-shadow:var(--shadow);border:1px solid var(--line)}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:18px 20px 4px}
.card-h h2{margin:0;font-size:14px;font-weight:600;letter-spacing:-0.005em}
.card-h small{font-size:12px;color:var(--muted)}

/* This week in 30 seconds */
.takeaways{list-style:none;margin:0;padding:6px 20px 6px;counter-reset:t}
.takeaways li{counter-increment:t;display:grid;grid-template-columns:26px 1fr;gap:6px;padding:12px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.55;color:var(--ink-2)}
.takeaways li:first-child{border-top:0}
.takeaways li::before{content:counter(t);font-size:22px;font-weight:300;line-height:1.05;color:var(--accent-ink)}
.copy{display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 40px);margin:4px 20px 18px;padding:10px;border:1px solid var(--line-2);background:#fff;color:var(--ink);font-size:13px;font-weight:500;cursor:pointer}
.copy:hover{border-color:var(--accent-ink);color:var(--accent-ink)}

/* Trend radar (folds away on phones) */
details.card > summary{list-style:none;cursor:pointer}
details.card > summary::-webkit-details-marker{display:none}
details.card > summary .chev{width:8px;height:8px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);margin-left:6px;transition:transform .2s;align-self:center}
details[open].card > summary .chev{transform:rotate(-135deg)}
.card-h .grow{margin-left:auto}
.trends{list-style:none;margin:0;padding:4px 20px 6px}
.trends li{padding:11px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.trends li:first-child{border-top:0}
.trends .tt{display:flex;align-items:flex-start;gap:9px;font-size:14px;font-weight:500;line-height:1.4}
.trends .ev{font-size:13px;color:var(--muted);line-height:1.5}
.st{flex:none;margin-top:2px;font-size:11px;font-weight:600;padding:1px 7px;white-space:nowrap}
.st-new{background:#EEEAF9;color:#5B4A9E}.st-rising{background:#E3F3EA;color:#1F7A4D}
.st-steady{background:#EFEFEC;color:#55555F}.st-cooling{background:#FBE9E1;color:#B0501E}
.mom{padding:6px 20px 18px;display:flex;flex-direction:column;gap:8px}
.mom .sub{font-size:12px;color:var(--muted);margin:8px 0 2px;padding-top:12px;border-top:1px solid var(--line)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 72px 50px;align-items:center;gap:10px;font-size:12.5px}
.mrow .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.mrow .bar{height:6px;background:#EEF1F6;position:relative}
.mrow .bar i{position:absolute;left:0;top:0;bottom:0}
.mrow .dl{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.up{color:#1F7A4D}.down{color:#B0501E}.flat{color:var(--muted)}

/* ---------- Filter bar ---------- */
.filters{margin:0 0 16px}
.filters .rows{background:var(--card);box-shadow:var(--shadow);border:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.frow{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.frow .grow{flex:1}
.frow .lbl{font-size:12px;color:var(--muted);margin-right:2px}
.seg{display:inline-flex;border:1px solid var(--line-2);background:#fff;flex:none}
.seg button{border:0;background:transparent;padding:7px 13px;font-size:13px;font-weight:500;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button:hover{color:var(--accent-ink)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.seg .n{font-size:11.5px;opacity:.65;font-variant-numeric:tabular-nums}
.seg .flag{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.sep-v{width:1px;align-self:stretch;background:var(--line-2);margin:0 4px}
.types{display:flex;gap:8px;flex-wrap:wrap}
.tsel{display:block;position:relative;flex:none}
.tsel select{appearance:none;-webkit-appearance:none;border:1px solid var(--line-2);background:#fff;color:var(--ink);font-size:13px;font-weight:500;padding:7px 30px 7px 11px}
.tsel svg{position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:#fff;color:var(--ink);padding:6px 10px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--accent-ink)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip[disabled]{opacity:.4;cursor:default}
.chip .sw{width:8px;height:8px;border-radius:50%;flex:none}
.chip .n{font-size:11.5px;opacity:.6;font-variant-numeric:tabular-nums}
.feedhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 2px 12px;font-size:13px;color:var(--muted)}
.feedhead b{font-size:15px;font-weight:600;color:var(--ink)}
.clear{border:0;background:none;padding:0;color:var(--accent-ink);font-size:13px;font-weight:500;cursor:pointer}
.clear:hover{text-decoration:underline}

/* ---------- Story cards ---------- */
.posts{display:flex;flex-direction:column;gap:14px}
.post{position:relative;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1fr) 208px;gap:22px;padding:20px 22px;transition:box-shadow .2s,transform .2s}
.post:hover{box-shadow:var(--shadow-hover)}
.post .body{display:flex;flex-direction:column;gap:9px;min-width:0}
.kick{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden}
.kick .dot{width:8px;height:8px;border-radius:50%;background:var(--k);flex:none}
.kick .c{font-weight:600;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis}
.kick .s{overflow:hidden;text-overflow:ellipsis}
.post h3{margin:0;font-size:18px;font-weight:600;line-height:1.38;letter-spacing:-0.01em;text-wrap:pretty}
.post h3 a{text-decoration:none}
.post h3 a:hover{color:var(--accent-ink)}
.post .sum{margin:0;color:var(--ink-2);font-size:14.5px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.why{background:var(--wt);padding:10px 13px;border-left:3px solid var(--k)}
.why b{display:block;font-size:11.5px;font-weight:600;color:var(--ink-2);margin-bottom:2px}
.why span{font-size:14px;color:var(--ink);line-height:1.5}
.meta{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;margin-top:auto;padding-top:4px;font-size:12.5px;color:var(--muted)}
.type{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--tc)}
.type::before{content:"";width:6px;height:6px;background:currentColor}
.t-investment{--tc:var(--inv)}.t-product{--tc:var(--prod)}.t-deployment{--tc:var(--dep)}.t-trend{--tc:var(--trend)}
.amt{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.gcc{padding:1px 7px;background:var(--mist);color:var(--accent-ink);font-weight:600;font-size:11.5px}
.src{margin-left:auto;display:inline-flex;align-items:center;font-weight:500;color:var(--accent-ink);text-decoration:none;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.src:hover{text-decoration:underline}
.src svg{margin-left:6px;flex:none}
.thumb{display:block;position:relative;align-self:start;width:208px;aspect-ratio:3/2;overflow:hidden;background:var(--wt)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
.post:hover .thumb img{transform:scale(1.03)}
.thumb .ph-ic{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.thumb .ph-ic svg{width:30px;height:30px;opacity:.7}
.thumb.has-img .ph-ic{display:none}

/* The week's top story gets a large image */
.post.lead{grid-template-columns:1fr;gap:0;padding:0}
.post.lead .thumb{width:100%;aspect-ratio:2.4/1;max-height:330px;order:-1}
.post.lead .body{padding:20px 24px 22px;gap:10px}
.post.lead h3{font-size:24px;line-height:1.3;letter-spacing:-0.015em}
.post.lead .sum{font-size:15.5px;-webkit-line-clamp:4}
.lead-tag{position:absolute;left:16px;top:16px;z-index:1;padding:4px 9px;background:var(--navy);color:#fff;font-size:11.5px;font-weight:600}
/* Top story without a picture: no empty tile, a coloured rule and the tag above the text */
.post.lead.noimg{border-top:3px solid var(--k)}
.post.lead.noimg .thumb{display:none}
.post.lead.noimg .lead-tag{position:static;justify-self:start;width:max-content;margin:20px 24px 0}
.post.lead.noimg .body{padding-top:12px}

.empty{background:var(--card);border:1px dashed var(--line-2);padding:36px;text-align:center;color:var(--muted)}

/* ---------- Our portfolio ---------- */
:root{--good:#2E7D4F;--risk:#D9622B;--mention:#769CD2;--none:#C9CCD3}
.ours{display:flex;flex-direction:column;gap:4px;padding:9px 12px;background:#F2F5FA;border-left:3px solid var(--navy);font-size:13px;color:var(--ink-2)}
.ours .ol{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.ours b{font-size:11.5px;font-weight:600;color:var(--navy)}
.ours .via{color:var(--muted)}
.ours .note{color:var(--ink);font-size:14px;line-height:1.5}
.stl{display:inline-block;padding:0 6px;font-size:11px;font-weight:600;line-height:1.6}
.s-deployed{background:#E3F3EA;color:#1F7A4D}.s-pilot{background:#E6EEF8;color:#3F6FAE}.s-planned{background:#EFEFEC;color:#55555F}
.vw{list-style:none;margin:0;padding:6px 12px 4px}
.vw li{border-top:1px solid var(--line)}
.vw li:first-child{border-top:0}
.vw button{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;align-items:center;gap:9px;width:100%;padding:10px 8px;border:0;background:none;text-align:left;cursor:pointer;color:var(--ink);font-size:14px}
.vw button:hover{background:#F2F5FA}
.vw button[aria-pressed="true"]{background:#EAF0F9}
.vw button[disabled]{cursor:default}
.vw button[disabled]:hover{background:none}
.vw .vn{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vw .vc{font-size:12px;color:var(--muted);white-space:nowrap}
.vw .vnote{padding:0 8px 10px 29px;font-size:12.5px;color:var(--muted);line-height:1.5}
.sig{width:10px;height:10px;border-radius:50%;background:var(--none)}
.sig.positive{background:var(--good)}.sig.risk{background:var(--risk)}.sig.mention{background:var(--mention)}
.sig.mixed{background:linear-gradient(90deg,var(--good) 50%,var(--risk) 50%)}
.vw-rest{margin:0;padding:4px 20px 6px;font-size:12.5px;color:var(--muted);line-height:1.5}
.vw-leg{display:flex;flex-wrap:wrap;gap:4px 12px;padding:8px 20px 16px;font-size:11.5px;color:var(--muted)}
.vw-leg span{display:inline-flex;align-items:center;gap:5px}
.vw-leg .sig{width:8px;height:8px}

/* ---------- Tabs: Stories · Viral watch · New vendors ---------- */
.tabs{display:flex;gap:4px;margin:0 0 14px;border-bottom:1px solid var(--line-2)}
.tabs button{border:0;background:none;padding:10px 14px 11px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--navy);font-weight:600}
.tabs .n{font-size:12px;color:var(--muted);font-weight:500}
.intro{margin:0 2px 14px;font-size:13.5px;color:var(--muted);line-height:1.55;max-width:720px}

/* Viral watch */
.vcard{display:grid;grid-template-columns:200px minmax(0,1fr);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:14px}
.vleft{background:var(--navy);color:#fff;padding:20px 18px;display:flex;flex-direction:column;gap:4px}
.vleft .plat{font-size:12px;color:var(--accent-soft);font-weight:500}
.vleft .vnum{font-size:44px;font-weight:200;line-height:1.05;letter-spacing:-0.02em;margin-top:12px;overflow-wrap:anywhere}
.vleft .vnum.sm{font-size:24px;font-weight:300}
.vleft .vt{font-size:12px;color:rgba(255,255,255,0.75)}
.vleft .vs{font-size:11.5px;color:rgba(255,255,255,0.6);margin-top:10px;line-height:1.45;overflow-wrap:anywhere}
.vright{padding:18px 22px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.vright h3{margin:0;font-size:18px;font-weight:600;line-height:1.35}
.vright p{margin:0;font-size:14px;color:var(--ink-2);line-height:1.55}
.vright p b{color:var(--ink);font-weight:600}
.checks{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:2px 0 0;padding:0}
.checks li{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;font-size:12px;border:1px solid var(--line-2);background:#fff}
.checks li i{font-style:normal;font-weight:700;font-size:11px;width:14px;text-align:center}
.checks .y{background:#EEF7EF;border-color:#BFE0C8}.checks .y i{color:#1F7A4D}
.checks .n{background:#FCEEE7;border-color:#F2C6B0}.checks .n i{color:#B0501E}
.checks .q i{color:var(--muted)}
.vrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.verdict{padding:3px 10px;font-size:12px;font-weight:600}
.verdict.hype{background:#FBE3CF;color:#8A4A14}.verdict.watch{background:#EFEFEC;color:#3B3B4A}.verdict.real{background:#E3F3EA;color:#1F7A4D}
.act{font-weight:600;color:var(--ink)}
.say{background:#F2F5FA;border-left:3px solid var(--navy);padding:10px 13px}
.say b{display:block;font-size:11.5px;font-weight:600;color:var(--navy);margin-bottom:2px}
.say span{font-size:14px;color:var(--ink);line-height:1.5}
.vfoot{font-size:12px;color:var(--muted);line-height:1.6;overflow-wrap:anywhere}
.vfoot a{color:var(--accent-ink);font-weight:500}

/* New vendors */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ccard{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);padding:18px 20px;display:flex;flex-direction:column;gap:9px}
.ccard .chd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ccard h3{margin:4px 0 0;font-size:17px;font-weight:600;line-height:1.3}
.ccard p{margin:0;font-size:14px;color:var(--ink-2);line-height:1.55}
.ccard p b{color:var(--ink);font-weight:600}
.cv{flex:none;padding:3px 10px;font-size:12px;font-weight:600}
.cv.add{background:#E3F3EA;color:#1F7A4D}.cv.watch{background:#E6EEF8;color:#3F6FAE}.cv.ignore{background:#EFEFEC;color:#55555F}
.scores{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;align-items:center;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.pips{display:inline-flex;gap:3px}.pips i{width:16px;height:7px;background:#E4E7EE}.pips i.f{background:var(--navy)}
.ctotal{font-size:12.5px;color:var(--muted)}
.ctotal b{color:var(--ink)}
.ccard .src{margin-left:0;margin-top:auto}

/* Category map, inside the Trend radar */
.map{padding:4px 14px 0}
.map svg{width:100%;height:auto;display:block}
.map svg text{font-family:Poppins,system-ui,sans-serif}
.map .cap{font-size:11.5px;color:var(--muted);padding:0 6px 6px;line-height:1.45}
.mkey{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;padding:2px 6px 8px;font-size:12px;color:var(--ink-2)}
.mkey span{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mkey i{flex:none;width:10px;height:10px;border-radius:50%;border:2px solid}
.foot{max-width:1200px;margin:0 auto;padding:18px 24px 44px;font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
.toast.on{opacity:1}

/* Wide screens: region, type and categories share one wrapping line */
@media (min-width: 961px){
  .filters .rows{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px}
  .frow{display:contents}
}

/* ---------- Tablet and phone ---------- */
@media (max-width: 960px){
  .wrap{grid-template-columns:1fr;padding:16px 16px 4px;gap:14px}
  .side{position:static;max-height:none;overflow:visible}
  .hero-in{grid-template-columns:1fr;padding:26px 16px 24px;gap:22px}
  .hero h1{font-size:26px}
  .stats{width:100%;justify-content:space-between}
  .stat{padding:0 12px;flex:1;min-width:0}
  .stat b{font-size:26px}
  .stat span{font-size:11.5px}
  .top{padding:10px 16px;gap:10px}
  .filters{margin:0 0 12px}
  .filters .rows{padding:10px 12px}
  .frow.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px}
  .frow.scroll::-webkit-scrollbar{display:none}
  .foot{padding:12px 16px 32px}
}
@media (max-width: 760px){
  .vcard{grid-template-columns:1fr}
  .vleft{flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:14px 16px}
  .vleft .plat{width:100%}
  .vleft .vnum{font-size:32px;margin-top:0}
  .vleft .vs{width:100%;margin-top:2px}
  .cgrid{grid-template-columns:1fr}
}
@media (max-width: 640px){
  :root{--header-h:53px}
  .tabs{overflow-x:auto;scrollbar-width:none}
  .tabs button{padding:10px 10px 11px}
  .vright{padding:16px}
  .post{grid-template-columns:1fr;gap:12px;padding:16px}
  .post .thumb{order:-1;width:100%;aspect-ratio:16/9}
  .post .thumb:not(.has-img){display:none}
  .post h3{font-size:17px}
  .post.lead .body{padding:16px 16px 18px}
  .post.lead h3{font-size:20px}
  .post.lead .thumb{aspect-ratio:16/9}
  .src .on{display:none}
  .brand .t2{display:none}
  .top .btn .lbl{display:none}
  .stat:first-child{padding-left:0}
  .stat{padding:0 8px}
  .stat b{font-size:22px}
  .stat span{font-size:10.5px}
}
@media print{.top,.filters,.copy{display:none}.wrap{grid-template-columns:1fr}.side{position:static;max-height:none}.post{break-inside:avoid;box-shadow:none}}
</style>
</head>
<body>

<header class="top" id="top">
  <a class="brand" href="index.html" aria-label="Back to the robotics fleet map">
    <img src="assets/img/aldar-logo.png" alt="Aldar">
    <span class="sep"></span>
    <span><span class="t1">Market Pulse</span><span class="t2">Robotics intelligence · Weekly</span></span>
  </a>
  <nav class="inav" aria-label="Market intelligence">
    <a href="intel.html" aria-current="page"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-6 5 12 2.5-6h4"/></svg>Pulse</a>
    <a href="scout.html"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>Scout</a>
  </nav>
  <div class="right">
    <label class="sel" title="Choose an edition">
      <span class="vh">Edition</span>
      <select id="edition"></select>
      <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="#9DB9E0" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
    </label>
    <a class="btn primary" href="index.html" title="Back to the fleet map">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg><span class="lbl">Fleet map</span>
    </a>
  </div>
</header>

<section class="hero" aria-labelledby="headline">
  <div class="hero-in">
    <div>
      <div class="eyebrow"><span class="dot"></span><span id="edLabel">Loading</span></div>
      <h1 id="headline"></h1>
      <p class="period" id="period"></p>
    </div>
    <div class="stats" id="stats"></div>
  </div>
</section>

<main class="wrap">
  <aside class="side" aria-label="Summary">
    <section class="card" aria-labelledby="tkH">
      <div class="card-h"><h2 id="tkH">This week in 30 seconds</h2></div>
      <ol class="takeaways" id="takeaways"></ol>
      <button class="copy" id="copy" type="button">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="8" y="8" width="12" height="12"/><path d="M16 8V4H4v12h4"/></svg>Copy brief for email
      </button>
    </section>
    <section class="card" id="vendorCard" aria-labelledby="vwH" hidden>
      <div class="card-h"><h2 id="vwH">Our vendors this week</h2><small id="vwCount"></small></div>
      <ul class="vw" id="vw"></ul>
      <p class="vw-rest" id="vwRest"></p>
      <div class="vw-leg" id="vwLeg"></div>
    </section>
    <details class="card" id="trendPanel" hidden>
      <summary class="card-h"><h2>Trend radar</h2><small id="trendCount"></small><span class="chev" aria-hidden="true"></span></summary>
      <div class="map" id="map"></div>
      <ul class="trends" id="trends"></ul>
      <div class="mom" id="mom"></div>
    </details>
  </aside>

  <section class="feed" aria-label="Stories">
    <div class="tabs" id="tabs" role="tablist" aria-label="Sections" hidden></div>
    <div id="tab-viral" role="tabpanel" hidden></div>
    <div id="tab-vendors" role="tabpanel" hidden></div>
    <div id="tab-stories" role="tabpanel">
    <div class="filters" id="filters">
      <div class="rows">
        <div class="frow scroll">
          <span class="seg" id="region" role="group" aria-label="Region"></span>
          <label class="tsel"><span class="vh">Story type</span><select id="typeSel"></select>
            <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></label>
        </div>
        <div class="frow scroll" id="cats" role="group" aria-label="Category"></div>
      </div>
    </div>
    <div class="feedhead">
      <span><b id="feedTitle">All stories</b> · <span id="feedCount"></span></span>
      <button class="clear" id="clear" type="button" hidden>Clear filters</button>
    </div>
    <div class="posts" id="posts"></div>
    </div>
  </section>
</main>

<p class="foot" id="foot"></p>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data/intel-feed.js"></script>
<script>
(function () {
  "use strict";
  var FEED = window.INTEL_FEED || { meta: { categories: [] }, editions: [] };
  var CATS = {};
  (FEED.meta.categories || []).forEach(function (c) { CATS[c.id] = c; });
  /* Short names for the filter chips; cards keep the full category name. */
  var SHORT = { construction: "Construction", facade: "Façade", inspection: "Inspection", cleaning: "Cleaning", security: "Security",
                delivery: "Delivery & mobility", humanoids: "Humanoids", physical_ai: "Physical AI" };
  var TYPES = [["all", "All types"], ["investment", "Investment"], ["product", "Product"], ["deployment", "Deployment"], ["trend", "Trend"]];
  var TYPE_LABEL = { investment: "Investment", product: "Product", deployment: "Deployment", trend: "Trend" };

  /* Category icons (24px line icons, same style as the fleet map). */
  var ICONS = {
    construction: '<path d="M4 20h16"/><path d="M6 20V9l6-5 6 5v11"/><path d="M4 9h16"/><path d="M10 20v-5h4v5"/>',
    facade: '<rect x="5" y="3" width="14" height="18"/><path d="M5 8h14M5 13h14M5 18h14M12 3v18"/><rect x="13.5" y="9.5" width="4" height="2.5"/>',
    inspection: '<circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/><path d="M7.5 10.5h6M10.5 7.5v6"/>',
    cleaning: '<rect x="4.5" y="5" width="15" height="10.5" rx="2"/><path d="M8 9.5h8"/><circle cx="8" cy="18.5" r="1.8"/><circle cx="16" cy="18.5" r="1.8"/>',
    security: '<path d="M12 3l7 2.8v5.4c0 4.6-3 7.9-7 9.8-4-1.9-7-5.2-7-9.8V5.8z"/><circle cx="12" cy="11" r="2.4"/><path d="M12 13.4V16"/>',
    delivery: '<path d="M4 7.8L12 4l8 3.8v8.4L12 20l-8-3.8z"/><path d="M4 7.8l8 3.8 8-3.8M12 11.6V20"/><path d="M8 5.9l8 3.8"/>',
    humanoids: '<circle cx="12" cy="5.5" r="2.5"/><path d="M8 21v-6H6.5v-4.5a3 3 0 0 1 3-3h5a3 3 0 0 1 3 3V15H16v6"/><path d="M10 21v-4h4v4"/>',
    physical_ai: '<rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M10 10h4v4h-4z"/><path d="M9.5 4v3M14.5 4v3M9.5 17v3M14.5 17v3M4 9.5h3M4 14.5h3M17 9.5h3M17 14.5h3"/>'
  };

  var state = { ed: 0, cat: "all", type: "all", region: /(^|#|&)gcc\b/i.test(location.hash) ? "gcc" : /(^|#|&)ours\b/i.test(location.hash) ? "ours" : "all", vendor: null,
                tab: /(^|#|&)viral\b/i.test(location.hash) ? "viral" : /(^|#|&)new-vendors\b/i.test(location.hash) ? "vendors" : "stories" };
  /* One lens at a time: all stories, GCC stories, or stories about vendors we work with. */
  function linked(p) { return (p.portfolio || []).length > 0; }
  function inRegion(p) {
    if (state.region === "gcc") return p.region === "GCC";
    if (state.region === "ours") return linked(p) && (!state.vendor || p.portfolio.some(function (l) { return l.vendor === state.vendor; }));
    return true;
  }
  var $ = function (id) { return document.getElementById(id); };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }
  function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : "#"; }
  function money(m) {
    if (!m) return "";
    return m >= 1000 ? "$" + (m / 1000).toFixed(m % 1000 ? 1 : 0) + "B" : "$" + Math.round(m) + "M";
  }
  function fmtDate(iso) {
    var d = new Date(iso + "T00:00:00");
    return isNaN(d) ? "" : d.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
  }
  function ago(iso) {
    if (!iso) return "";
    var d = new Date(iso + "T12:00:00"), days = Math.round((Date.now() - d) / 864e5);
    if (isNaN(days)) return "";
    if (days <= 0) return "Today";
    if (days === 1) return "Yesterday";
    if (days < 7) return days + " days ago";
    return fmtDate(iso);
  }
  function catOf(id) { return CATS[id] || { id: id, label: id, color: "#769CD2", ink: "#3F6FAE" }; }
  function icon(id, ink) {
    return '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="' + ink + '" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[id] || ICONS.physical_ai) + "</svg>";
  }
  function tint(hex, a) {
    var n = parseInt(hex.slice(1), 16);
    return "rgba(" + (n >> 16) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";
  }
  function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }

  function edition() { return FEED.editions[state.ed]; }
  function filtering() { return state.cat !== "all" || state.type !== "all" || state.region !== "all"; }

  function renderEditionPicker() {
    var sel = $("edition");
    sel.innerHTML = FEED.editions.map(function (e, i) {
      return '<option value="' + i + '">' + esc((e.label || e.id).replace(/\s+20\d\d$/, "")) + "</option>";
    }).join("");
    sel.value = String(state.ed);
    sel.onchange = function () { state.ed = +sel.value; state.cat = "all"; state.type = "all"; render(); };
  }

  function renderHero(e) {
    var posts = e.posts || [];
    var inv = posts.filter(function (p) { return p.type === "investment"; });
    var total = inv.reduce(function (s, p) { return s + (p.amount_usd_m || 0); }, 0);
    var gcc = posts.filter(function (p) { return p.region === "GCC"; }).length;
    $("edLabel").textContent = (state.ed === 0 ? "Latest edition · " : "Archive · ") + (e.label || e.id);
    $("headline").textContent = e.headline || "";
    var bits = [];
    if (e.period) bits.push(fmtDate(e.period.from) + " – " + fmtDate(e.period.to));
    if (e.stories_scanned) bits.push(e.stories_scanned + " articles read" + (e.distinct_events ? ", " + e.distinct_events + " distinct stories" : ""));
    $("period").textContent = bits.join(" · ");
    var stats = [[posts.length, "Stories"], [inv.length, "Funding deals"], [money(total) || "–", "Capital raised"]];
    $("stats").innerHTML = stats.map(function (s) {
      return '<div class="stat"><b>' + esc(s[0]) + "</b><span>" + esc(s[1]) + "</span></div>";
    }).join("") +
      '<button class="stat" type="button" data-region="toggle" aria-pressed="' + (state.region === "gcc") + '" title="' + (state.region === "gcc" ? "Show all regions" : "Show only GCC stories") + '"><b>' + gcc + "</b><span>GCC stories</span></button>";
  }

  function renderTakeaways(e) {
    $("takeaways").innerHTML = (e.takeaways || []).map(function (t) { return "<li><span>" + esc(t) + "</span></li>"; }).join("");
  }

  var STATUS = { "new": "New", rising: "▲ Rising", steady: "Steady", cooling: "▼ Cooling" };
  function renderTrends(e) {
    var tw = e.trend_watch || [], mo = e.momentum || [];
    $("trendPanel").hidden = !tw.length && !mo.length && !(e.matrix || []).length;
    $("trendCount").textContent = tw.length ? plural(tw.length, "theme", "themes") : "";
    $("trends").innerHTML = tw.map(function (t) {
      var st = STATUS[t.status] ? t.status : "steady";
      return '<li><span class="tt"><span class="st st-' + st + '">' + STATUS[st] + "</span><span>" + esc(t.trend) + '</span></span><span class="ev">' + esc(t.evidence) + "</span></li>";
    }).join("");
    var rows = mo.filter(function (m) { return m.volume || m.avg_prev; });
    var max = Math.max.apply(null, rows.map(function (m) { return m.volume; }).concat([1]));
    var hasHist = rows.some(function (m) { return m.avg_prev != null; });
    $("mom").innerHTML = rows.length ? '<div class="sub">News volume this week' + (hasHist ? ", against the average of earlier weeks" : ". Week-on-week comparisons start next edition.") + "</div>" +
      rows.map(function (m) {
        var c = catOf(m.category), d, cls;
        if (m.avg_prev == null) { d = String(m.volume); cls = "flat"; }
        else if (!m.avg_prev) { d = m.volume ? "new" : "–"; cls = m.volume ? "up" : "flat"; }
        else { var pct = m.change_pct || 0; d = (pct > 0 ? "▲ " : pct < 0 ? "▼ " : "") + Math.abs(pct) + "%"; cls = pct >= 10 ? "up" : pct <= -10 ? "down" : "flat"; }
        return '<div class="mrow" title="' + esc(c.label) + ": " + m.volume + " stories" + (m.avg_prev != null ? ", weekly average " + m.avg_prev : "") + ", " + m.deals + ' funding deals"><span class="lb">' + esc(c.label) + '</span><span class="bar"><i style="width:' + Math.round(m.volume / max * 100) + "%;background:" + esc(c.color) + '"></i></span><span class="dl ' + cls + '">' + d + "</span></div>";
      }).join("") : "";
  }

  var SIGNAL = { positive: "Good news", risk: "Risk", mixed: "Mixed", mention: "In the news", none: "No news" };
  function renderVendors(e) {
    var rows = e.vendor_watch || [];
    $("vendorCard").hidden = !rows.length;
    if (!rows.length) return;
    var news = rows.filter(function (w) { return w.signal !== "none"; }), quiet = rows.filter(function (w) { return w.signal === "none"; });
    $("vwCount").textContent = news.length + " of " + rows.length + " in the news";
    $("vw").innerHTML = news.length ? news.map(function (w) {
      var n = (w.post_ids || []).length, sel = state.region === "ours" && state.vendor === w.vendor;
      return "<li><button type=\"button\" data-vendor=\"" + esc(w.vendor) + "\" aria-pressed=\"" + sel + "\"" + (n ? "" : " disabled") + " title=\"" + esc(SIGNAL[w.signal]) + (w.oem ? " · equipment by " + esc(w.oem) : "") + "\">" +
        '<span class="sig ' + esc(w.signal) + '" aria-label="' + esc(SIGNAL[w.signal]) + '"></span><span class="vn">' + esc(w.vendor) + "</span>" +
        '<span class="stl s-' + esc(w.status) + '">' + esc(w.status_label) + '</span><span class="vc">' + (n ? plural(n, "story", "stories") : "mentioned") + "</span></button>" +
        (w.note ? '<div class="vnote">' + esc(w.note) + "</div>" : "") +
        (!n && w.article && /^https:\/\//.test(w.article.url || "") ? '<div class="vnote"><a href="' + esc(w.article.url) + '" target="_blank" rel="noopener" style="color:var(--accent-ink)">' + esc(w.article.title) + "</a> · " + esc(w.article.source) + "</div>" : "") + "</li>";
    }).join("") : '<li style="padding:10px 8px;color:var(--muted);font-size:13.5px">No news about our vendors this week.</li>';
    $("vwRest").textContent = quiet.length ? "No news: " + quiet.map(function (w) { return w.vendor; }).join(", ") + "." : "";
    var byHeadline = news.some(function (w) { return w.signal_by === "headlines"; });
    $("vwLeg").innerHTML = news.length ? ["positive", "risk", "mixed", "mention"].map(function (k) { return '<span><i class="sig ' + k + '"></i>' + SIGNAL[k] + "</span>"; }).join("") +
      (byHeadline ? '<span style="width:100%">Good news and risks are read from headlines.</span>' : "") : "";
  }

  function showTab(t) {
    state.tab = t;
    ["stories", "viral", "vendors"].forEach(function (k) { $("tab-" + k).hidden = k !== t; });
    Array.prototype.forEach.call($("tabs").querySelectorAll("button"), function (b) { b.setAttribute("aria-selected", String(b.getAttribute("data-tab") === t)); });
  }
  function renderTabs(e) {
    var v = (e.viral || []).length, c = (e.challengers || []).length;
    $("tabs").hidden = !v && !c;
    if (!v && !c) { showTab("stories"); return; }
    $("tabs").innerHTML = [["stories", "Stories", (e.posts || []).length], v ? ["viral", "Viral watch", v] : null, c ? ["vendors", "New vendors", c] : null]
      .filter(Boolean).map(function (t) { return '<button type="button" role="tab" data-tab="' + t[0] + '" aria-selected="false">' + t[1] + '<span class="n">' + t[2] + "</span></button>"; }).join("");
    if ((state.tab === "viral" && !v) || (state.tab === "vendors" && !c)) state.tab = "stories";
    renderViral(e); renderChallengers(e); showTab(state.tab);
  }

  var CHECK = [["real", "Real footage"], ["autonomous", "Truly autonomous"], ["corroborated", "Independently confirmed"], ["deployed", "Commercially deployed"], ["gcc", "Fits GCC conditions"]];
  var VERDICT = { hype: "Hype for now", watch: "Watch", real: "Real potential" };
  function link(u, label) { return /^https:\/\//i.test(u || "") ? '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(label) + "</a>" : ""; }
  function renderViral(e) {
    var items = e.viral || [];
    $("tab-viral").innerHTML = '<p class="intro">The week\u2019s most-watched robot videos, checked before leadership asks. Reach is shown as reported, with its source. Claude reads the coverage and the page text; it does not watch the videos.</p>' +
      items.map(function (v) {
        var c = catOf(v.category), checks = v.checks || {};
        var sources = (v.corroboration || []).map(function (x) { return link(x.url, x.label); }).filter(Boolean).join(", ");
        return '<article class="vcard"><div class="vleft"><div class="plat">' + esc(v.platform) + " · " + esc(v.date) + '</div><div class="vnum' + (String(v.views_reported).length > 7 ? " sm" : "") + '">' + esc(v.views_reported) + '</div><div class="vt">views, as reported</div><div class="vs">' + esc(v.views_source) + "</div></div>" +
          '<div class="vright"><div class="kick" style="--k:' + esc(c.color) + '"><span class="dot"></span><span class="c">' + esc(c.label) + "</span></div><h3>" + esc(v.title) + "</h3>" +
          "<p><b>What it shows.</b> " + esc(v.what_shows) + "</p><p><b>What\u2019s behind it.</b> " + esc(v.what_behind) + "</p>" +
          '<ul class="checks">' + CHECK.map(function (k) { var a = checks[k[0]] || "unknown"; return '<li class="' + (a === "yes" ? "y" : a === "no" ? "n" : "q") + '"><i>' + (a === "yes" ? "\u2713" : a === "no" ? "\u2715" : "?") + "</i>" + k[1] + "</li>"; }).join("") + "</ul>" +
          '<div class="vrow"><span class="verdict ' + esc(v.verdict) + '">' + esc(VERDICT[v.verdict] || v.verdict) + "</span><span>Aldar fit: " + esc(v.fit) + "</span>" + (v.portfolio_match ? "<span>Closest match: " + esc(v.portfolio_match) + "</span>" : "") + '<span class="act">' + esc(v.action) + "</span></div>" +
          '<div class="say"><b>If leadership asks</b><span>' + esc(v.leadership_line) + "</span></div>" +
          '<div class="vfoot">Assessed from: ' + esc(v.assessed_from) + (v.video_url ? " · " + link(v.video_url, "Open the video") : "") + (sources ? " · Sources: " + sources : "") + "</div></div></article>";
      }).join("");
  }

  var CRIT = [["funding", "Funding"], ["deployments", "Named deployments"], ["scale", "Scale"], ["partners", "Credible partners"], ["gcc", "Route to the GCC"]];
  var CVERDICT = { add: "Consider adding", watch: "Watch", ignore: "Ignore for now" };
  function renderChallengers(e) {
    var items = e.challengers || [];
    $("tab-vendors").innerHTML = '<p class="intro">Vendors not yet in our portfolio, with news this month, scored 0 to 4 on five traction measures. 14 or more with named deployments: worth adding to the tracker; 8 to 13: watch; under 8: ignore for now. Claude proposes; the Innovation team decides.</p><div class="cgrid">' +
      items.map(function (x) {
        var c = catOf(x.category), sc = x.scores || {};
        return '<article class="ccard"><div class="chd"><div><div class="kick" style="--k:' + esc(c.color) + '"><span class="dot"></span><span class="c">' + esc(c.label) + "</span></div><h3>" + esc(x.name) + '</h3></div><span class="cv ' + esc(x.verdict) + '">' + esc(CVERDICT[x.verdict] || x.verdict) + "</span></div>" +
          "<p>" + esc(x.what) + "</p><p><b>Why it matters to us.</b> " + esc(x.why) + "</p>" +
          '<div class="scores">' + CRIT.map(function (k) { var n = sc[k[0]] || 0; return "<span>" + k[1] + '</span><span class="pips" aria-label="' + n + ' of 4">' + [1, 2, 3, 4].map(function (i) { return '<i class="' + (i <= n ? "f" : "") + '"></i>'; }).join("") + "</span>"; }).join("") + "</div>" +
          '<div class="ctotal">Score <b>' + esc(x.total) + "</b> of 20</div>" +
          (x.source && /^https:\/\//.test(x.source.url || "") ? '<a class="src" href="' + esc(x.source.url) + '" target="_blank" rel="noopener"><span>' + esc(x.source.label || "Source") + '</span><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg></a>' : "") +
          "</article>";
      }).join("") + "</div>";
  }

  /* Readiness against relevance, one dot per category. A hollow dot means attention runs ahead of evidence. */
  function renderMap(e) {
    var m = e.matrix || [];
    if (!m.length) { $("map").innerHTML = ""; return; }
    var X0 = 30, X1 = 292, Y0 = 8, Y1 = 196, mx = (X0 + X1) / 2, my = (Y0 + Y1) / 2;
    var svg = '<svg viewBox="0 0 300 226" role="img" aria-label="Category map: market readiness against relevance to Aldar">' +
      '<rect x="' + mx + '" y="' + Y0 + '" width="' + (X1 - mx) + '" height="' + (my - Y0) + '" fill="#EEF5EF"/>' +
      '<rect x="' + X0 + '" y="' + Y0 + '" width="' + (mx - X0) + '" height="' + (my - Y0) + '" fill="#F4F6FA"/>' +
      '<line x1="' + X0 + '" y1="' + Y1 + '" x2="' + X1 + '" y2="' + Y1 + '" stroke="#9AA0AC"/><line x1="' + X0 + '" y1="' + Y0 + '" x2="' + X0 + '" y2="' + Y1 + '" stroke="#9AA0AC"/>' +
      '<line x1="' + mx + '" y1="' + Y0 + '" x2="' + mx + '" y2="' + Y1 + '" stroke="#C9CCD3" stroke-dasharray="3 3"/><line x1="' + X0 + '" y1="' + my + '" x2="' + X1 + '" y2="' + my + '" stroke="#C9CCD3" stroke-dasharray="3 3"/>' +
      '<text x="' + (X0 + 5) + '" y="' + (Y0 + 12) + '" font-size="9" font-weight="600" fill="#6A6A78">WATCH</text>' +
      '<text x="' + (X1 - 5) + '" y="' + (Y0 + 12) + '" font-size="9" font-weight="600" fill="#1F7A4D" text-anchor="end">ACT / PILOT</text>' +
      '<text x="' + (X0 + 5) + '" y="' + (Y1 - 6) + '" font-size="9" font-weight="600" fill="#9AA0AC">PARK</text>' +
      '<text x="' + (X1 - 5) + '" y="' + (Y1 - 6) + '" font-size="9" font-weight="600" fill="#9AA0AC" text-anchor="end">USE WHEN NEEDED</text>' +
      '<text x="' + mx + '" y="' + (Y1 + 16) + '" font-size="10" fill="#6A6A78" text-anchor="middle">Market readiness \u2192</text>' +
      '<text transform="translate(11 ' + my + ') rotate(-90)" font-size="10" fill="#6A6A78" text-anchor="middle">Relevance to Aldar \u2192</text>';
    m.forEach(function (d) {
      var c = catOf(d.category), x = X0 + d.readiness / 100 * (X1 - X0), y = Y1 - d.relevance / 100 * (Y1 - Y0), hype = d.hype - d.substance >= 15;
      svg += '<g><title>' + esc(c.label) + ": readiness " + d.readiness + ", relevance " + d.relevance + ", hype " + d.hype + ", substance " + d.substance + ". " + esc(d.reason || "") + "</title>" +
        '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="6.5" fill="' + (hype ? "#fff" : esc(c.color)) + '" stroke="' + esc(c.ink || c.color) + '" stroke-width="' + (hype ? 2.2 : 1) + '"/></g>';
    });
    svg += "</svg>";
    var key = m.map(function (d) {
      var c = catOf(d.category), hype = d.hype - d.substance >= 15;
      return '<span title="' + esc(d.reason || "") + '"><i style="background:' + (hype ? "#fff" : esc(c.color)) + ";border-color:" + esc(c.ink || c.color) + '"></i>' + esc(SHORT[d.category] || c.label) + "</span>";
    }).join("");
    $("map").innerHTML = svg + '<div class="mkey">' + key + '</div><div class="cap">Hollow dot: attention ahead of evidence. Positions are Claude\u2019s judgement from this week\u2019s research, not a measurement.</div>';
  }

  function renderFilters(e) {
    var all = e.posts || [], posts = all.filter(inRegion), counts = {};
    var gccN = all.filter(function (p) { return p.region === "GCC"; }).length;
    var oursN = all.filter(linked).length;
    $("region").innerHTML =
      '<button type="button" data-region="all" aria-pressed="' + (state.region === "all") + '">All stories<span class="n">' + all.length + "</span></button>" +
      '<button type="button" data-region="gcc" aria-pressed="' + (state.region === "gcc") + '"><span class="flag"></span>GCC<span class="n">' + gccN + "</span></button>" +
      (oursN ? '<button type="button" data-region="ours" aria-pressed="' + (state.region === "ours") + '" title="Stories about vendors we work with, or the makers of their equipment"><span class="flag" style="background:var(--navy)"></span>Our vendors<span class="n">' + oursN + "</span></button>" : "");
    $("typeSel").innerHTML = TYPES.map(function (t) {
      return '<option value="' + t[0] + '"' + (state.type === t[0] ? " selected" : "") + ">" + t[1] + "</option>";
    }).join("");
    posts.forEach(function (p) { counts[p.category] = (counts[p.category] || 0) + 1; });
    var list = [{ id: "all", label: "All" }].concat(FEED.meta.categories || []);
    $("cats").innerHTML = list.map(function (c) {
      var n = c.id === "all" ? posts.length : (counts[c.id] || 0);
      return '<button class="chip" type="button" data-cat="' + esc(c.id) + '" aria-pressed="' + (state.cat === c.id) + '"' + (n || state.cat === c.id ? "" : " disabled") + ">" +
        (c.color ? '<span class="sw" style="background:' + esc(c.color) + '"></span>' : "") + esc(SHORT[c.id] || c.label) + '<span class="n">' + n + "</span></button>";
    }).join("");
  }

  /* Thumbnail from the news site's preview image; a branded tile when there is none
     or it fails to load. No referrer is sent, as with any link preview. */
  function thumbHtml(p, c) {
    var img = /^https:\/\//i.test(p.image || "") ?
      '<img src="' + esc(p.image) + '" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.parentNode.classList.remove(\'has-img\');this.remove()">' : "";
    return '<a class="thumb' + (img ? " has-img" : "") + '" href="' + esc(safeUrl(p.url)) + '" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true">' +
      '<span class="ph-ic">' + icon(c.id, c.ink) + "</span>" + img + "</a>";
  }

  /* "Our vendor" line: which vendor we work with this story touches, what they run for us and where. */
  function oursHtml(p) {
    var links = (p.portfolio || []).slice(0, 2);
    if (!links.length) return "";
    return '<div class="ours">' + links.map(function (l) {
      var who = "<span>" + esc(l.vendor) + (l.via === "oem" && l.oem ? ' <span class="via">· runs ' + esc(l.oem) + " equipment for us</span>" : "") + "</span>";
      var where = '<span class="stl s-' + esc(l.status) + '">' + esc(l.status_label) + "</span>" +
        "<span>" + esc(l.use_case) + " · " + esc(l.site) + (l.site_count > 1 ? " +" + (l.site_count - 1) + (l.site_count > 2 ? " sites" : " site") : "") + "</span>";
      return '<div class="ol"><b>Our vendor</b>' + who + '</div><div class="ol">' + where + "</div>";
    }).join("") + (p.portfolio_note ? '<span class="note">' + esc(p.portfolio_note) + "</span>" : "") + "</div>";
  }

  function postHtml(p, lead) {
    var c = catOf(p.category);
    var when = ago(p.published);
    var kick = '<div class="kick"><span class="dot"></span><span class="c">' + esc(c.label) + '</span><span aria-hidden="true">·</span><span class="s">' + esc(p.source || "") + "</span>" +
      (when ? '<span aria-hidden="true">·</span><span>' + esc(when) + "</span>" : "") + "</div>";
    var meta = ['<span class="type t-' + esc(p.type) + '">' + esc(TYPE_LABEL[p.type] || p.type) + "</span>"];
    if (p.amount_usd_m) meta.push('<span class="amt">' + money(p.amount_usd_m) + "</span>");
    if (p.region === "GCC") meta.push('<span class="gcc">GCC</span>');
    else if (p.region && p.region !== "Global") meta.push("<span>" + esc(p.region) + "</span>");
    if (p.company) meta.push("<span>" + esc(p.company) + "</span>");
    if (p.coverage > 1) meta.push('<span title="Also covered by ' + esc((p.also_covered_by || []).join(", ")) + '">' + p.coverage + " outlets</span>");
    meta.push('<a class="src" href="' + esc(safeUrl(p.url)) + '" target="_blank" rel="noopener"><span>Read</span><span class="on">&nbsp;on ' + esc(p.source || "source") + '</span><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg></a>');
    var hasImg = /^https:\/\//i.test(p.image || "");
    return '<article class="post' + (lead ? " lead" + (hasImg ? "" : " noimg") : "") + '" style="--k:' + esc(c.color) + ";--wt:" + tint(c.color, 0.12) + '">' +
      (lead ? '<span class="lead-tag">Top story</span>' : "") +
      '<div class="body">' + kick +
      '<h3><a href="' + esc(safeUrl(p.url)) + '" target="_blank" rel="noopener">' + esc(p.headline) + "</a></h3>" +
      (p.summary ? '<p class="sum">' + esc(p.summary) + "</p>" : "") +
      oursHtml(p) +
      (p.why_it_matters ? '<div class="why"><b>Why it matters for Aldar</b><span>' + esc(p.why_it_matters) + "</span></div>" : "") +
      '<div class="meta">' + meta.join("") + "</div></div>" +
      thumbHtml(p, c) + "</article>";
  }

  function renderPosts(e) {
    var posts = (e.posts || []).filter(function (p) {
      return inRegion(p) && (state.cat === "all" || p.category === state.cat) && (state.type === "all" || p.type === state.type);
    });
    var title = state.cat === "all" ? (state.type === "all" ? "All stories" : TYPE_LABEL[state.type]) : catOf(state.cat).label + (state.type !== "all" ? " · " + TYPE_LABEL[state.type] : "");
    if (state.region === "gcc") title = "GCC · " + title;
    if (state.region === "ours") title = (state.vendor || "Our vendors") + " · " + title;
    $("feedTitle").textContent = title;
    $("feedCount").textContent = plural(posts.length, "story", "stories");
    $("clear").hidden = !filtering();
    $("posts").innerHTML = posts.length ? posts.map(function (p, i) { return postHtml(p, i === 0); }).join("") :
      '<div class="empty">' + (state.region === "gcc" ? "No GCC stories match these filters this week." : state.region === "ours" ? "No stories about our vendors match these filters this week." : "No stories match these filters this week.") + "</div>";
  }

  function render() {
    var e = edition();
    if (!e) {
      $("edLabel").textContent = "No editions yet";
      $("headline").textContent = "The first edition will appear after the next Monday run.";
      $("posts").innerHTML = '<div class="empty">No stories yet.</div>';
      return;
    }
    renderHero(e); renderTakeaways(e); renderVendors(e); renderTrends(e); renderMap(e); renderFilters(e); renderPosts(e); renderTabs(e);
    var by = { claude: "Stories selected and summarised by Claude from public news sources.", rules: "Stories selected automatically from public news sources; headlines shown as published.", seed: "Launch edition compiled by Claude from public news sources." }[e.generated_by] || "";
    $("foot").textContent = "Market Pulse updates every Monday at 10:00 Abu Dhabi time. " + by + " Images and summaries belong to their publishers. Check the source before quoting figures.";
  }

  /* Re-render after a filter change, keeping the top of the list in view. */
  function refresh(heroToo) {
    var e = edition(); if (heroToo) renderHero(e); renderFilters(e); renderPosts(e);
    var headerH = $("top").offsetHeight, feedTop = $("filters").parentNode.getBoundingClientRect().top;
    if (feedTop < headerH)  // list starts above the screen: bring the filters and first story back into view
      window.scrollTo({ top: window.scrollY + feedTop - headerH - 12, behavior: "smooth" });
  }
  function setRegion(r, vendor) {
    state.region = r; state.vendor = r === "ours" ? (vendor || null) : null;
    try { history.replaceState(null, "", r === "gcc" ? "#gcc" : r === "ours" ? "#ours" : location.pathname + location.search); } catch (err) {}
    if (state.tab !== "stories") showTab("stories");
    refresh(true); renderVendors(edition());
  }
  $("cats").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-cat]"); if (!b || b.disabled) return;
    state.cat = b.getAttribute("data-cat"); refresh();
  });
  $("typeSel").addEventListener("change", function () { state.type = this.value; refresh(); });
  $("region").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-region]"); if (b) setRegion(b.getAttribute("data-region"));
  });
  $("stats").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-region]"); if (b) setRegion(state.region === "gcc" ? "all" : "gcc");
  });
  $("clear").addEventListener("click", function () { state.cat = "all"; state.type = "all"; setRegion("all"); });
  $("vw").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-vendor]"); if (!b || b.disabled) return;
    var v = b.getAttribute("data-vendor");
    if (state.region === "ours" && state.vendor === v) setRegion("all"); else { state.cat = "all"; state.type = "all"; setRegion("ours", v); }
    var top = $("tabs").hidden ? $("filters") : $("tabs");
    window.scrollTo({ top: window.scrollY + top.getBoundingClientRect().top - $("top").offsetHeight - 12, behavior: "smooth" });
  });
  $("tabs").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-tab]"); if (!b) return;
    showTab(b.getAttribute("data-tab"));
    try { history.replaceState(null, "", state.tab === "viral" ? "#viral" : state.tab === "vendors" ? "#new-vendors" : location.pathname + location.search); } catch (err) {}
  });

  /* Plain-text brief that pastes cleanly into email, Teams or WhatsApp. */
  $("copy").addEventListener("click", function () {
    var e = edition(); if (!e) return;
    var lines = ["Robotics Market Pulse · " + (e.label || e.id) + (state.region === "gcc" ? " · GCC" : state.region === "ours" ? " · Our vendors" : ""), "", e.headline, "", "Key takeaways:"];
    (e.takeaways || []).forEach(function (t, i) { lines.push((i + 1) + ". " + t); });
    if ((e.trend_watch || []).length) {
      lines.push("", "Trend radar:");
      e.trend_watch.forEach(function (t) { lines.push("• " + t.trend + " [" + t.status + "]: " + t.evidence); });
    }
    var inNews = (e.vendor_watch || []).filter(function (w) { return w.signal !== "none"; });
    if (inNews.length) {
      lines.push("", "Our vendors in the news:");
      inNews.forEach(function (w) { lines.push("• " + w.vendor + " [" + (SIGNAL[w.signal] || w.signal).toLowerCase() + "]" + (w.note ? ": " + w.note : "")); });
    }
    lines.push("", "Top stories:");
    (e.posts || []).filter(inRegion).slice(0, 8).forEach(function (p) {
      lines.push("• " + p.headline + (p.amount_usd_m ? " (" + money(p.amount_usd_m) + ")" : "") + " · " + p.url);
    });
    lines.push("", "Full feed: " + location.href.split("#")[0] + (state.region === "gcc" ? "#gcc" : state.region === "ours" ? "#ours" : ""));
    var text = lines.join("\n");
    var done = function () { var t = $("toast"); t.textContent = "Brief copied"; t.classList.add("on"); setTimeout(function () { t.classList.remove("on"); }, 1800); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
    else { fallbackCopy(text); done(); }
  });
  function fallbackCopy(text) {
    var ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (e) {} ta.remove();
  }

  /* Keep the sticky offsets in step with the real header height. */
  function syncHeader() { document.documentElement.style.setProperty("--header-h", $("top").offsetHeight + "px"); }
  window.addEventListener("resize", syncHeader);
  syncHeader();

  /* Trend radar starts open on wide screens and folded on phones, so stories come sooner. */
  try { $("trendPanel").open = window.matchMedia("(min-width: 961px)").matches; } catch (err) { $("trendPanel").open = true; }

  renderEditionPicker();
  render();
})();
</script>
</body>
</html>
