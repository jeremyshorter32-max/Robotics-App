# TEMPORARY: checks the deploy preview in a real browser. Removed before merge.
name: TEMP preview check
on:
  push:
    branches: [market-pulse-design]
    paths: [".github/workflows/tmp-preview-check.yml", "tmp-check/check.py"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - run: sleep 30 && python tmp-check/check.py || true
      - run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add tmp-check/result.json; git add tmp-check/*.png || true
          git commit -m "TEMP preview check results [skip ci]"
          git push
